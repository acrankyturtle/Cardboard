[package]
name = "cardboard-lib"
version = "0.1.0"
edition = "2024"

[features]
embassy = ["dep:embassy-rp", "dep:embassy-futures", "dep:embassy-usb"]

[dependencies]
async-trait = "0.1.88"
defmt = { version = "1.0.1", features = ["alloc"] }
embassy-time = { version = "0.4.0" }
embassy-rp = { version = "0.4.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"], optional = true }
embassy-futures = { version = "0.1.0", optional = true }
embassy-usb = { version = "0.4.0", optional = true }
serde = { version = "1.0.210", default-features = false, features = ["alloc"] }
serde-json-core = { version = "0.6.0", features = ["defmt"] }
uuid = { version = "1.10.0", default-features = false, features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.44.2", features = ["macros", "rt"]}
